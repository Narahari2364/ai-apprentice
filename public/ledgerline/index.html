<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledgerline enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Roboto,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;color:#212121;background:#fff;min-width:1180px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{cursor:pointer}
.r{text-align:right}

/* header */
.top{height:84px;display:flex;align-items:center;padding:0 26px 0 30px;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;z-index:20}
.burger{background:none;border:0;padding:6px;margin-right:20px;display:flex}
.logo{display:flex;align-items:center;gap:9px;font-size:30px;letter-spacing:-.4px;color:#1f2d3d;text-decoration:none}
.logo b{font-weight:500}.logo span span{font-weight:300}
.top-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.helpbtn{position:relative;background:none;border:0;padding:4px;display:flex}
.badge{position:absolute;top:-7px;right:-9px;background:#D32F2F;color:#fff;font-size:12px;font-weight:700;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 3px #f6d5d5}
.userbtn{background:none;border:0;text-align:right;padding:0;line-height:1.3;display:flex;flex-direction:column;align-items:flex-end}
.userbtn .n{font-size:17px;display:flex;align-items:center;gap:8px}
.userbtn .c{font-size:13px;color:#333;padding-right:24px}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:calc(100vh - 84px)}
.left{position:relative;background:#F8F8F8;border-right:1px solid #e2e2e2;padding:10px 12px 0 16px;display:flex;flex-direction:column;min-height:0}
.left.dim::after{content:"";position:absolute;inset:0;background:rgba(72,72,72,.62);z-index:5}
.right{position:relative;display:flex;flex-direction:column;min-height:0;background:#fff}
.scroll{flex:1;overflow:auto;min-height:0}

/* home */
.card{background:#fff;border:1px solid #e3e3e3;border-radius:3px}
.cardbar{height:60px;background:#2F74D0;color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px 0 20px;font-weight:700;font-size:18px;border-radius:3px 3px 0 0}
.cardbar .create{margin-left:auto;background:none;border:0;color:#fff;font-size:18px;display:flex;align-items:center;gap:8px;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:14px 0 48px}
.stat{background:none;border:0;padding:6px;position:relative}
.stat .num{display:block;font-size:44px;font-weight:300;line-height:1.1}
.stat .lab{display:block;font-size:17px}
.stat.ret .num,.stat.ret .lab{color:#C62828}
.stat .ii{position:absolute;top:8px;left:calc(50% + 26px)}
.stat.va{padding-top:26px;font-size:17px;line-height:1.45}
.lastlogin{margin-top:auto;padding:14px 2px;font-size:17px}
.notices{padding:34px 30px 30px 22px}
.co-logo{display:flex;justify-content:center;align-items:center;gap:18px;margin:16px 0 70px;color:#0F5257}
.co-logo .co-name{font-size:30px;font-weight:500;letter-spacing:.02em;line-height:1.05}
.co-logo .co-name small{display:block;font-size:15px;letter-spacing:.32em;font-weight:400;margin-top:6px}
.spaced{text-align:center;letter-spacing:.55em;color:#8a9199;font-size:15px;margin:44px 0 30px;text-transform:uppercase}
.notices p{font-size:15.5px;line-height:1.5;margin:0 0 18px}
.notices .g{color:#1E6B3C;font-size:19px}
.notices a{color:#3a72d8;text-decoration:none}

/* report panel */
.rep{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid #e3e3e3;margin-bottom:0}
.repbar{height:75px;flex:none;background:#2F74D0;color:#fff;display:flex;align-items:stretch}
.repbar .back{width:82px;border:0;background:none;display:grid;place-items:center;border-right:1px solid rgba(255,255,255,.28)}
.repbar .ttl{flex:1;padding:17px 22px;line-height:1.12;min-width:0}
.repbar .ttl small{display:block;font-size:14.5px;opacity:.88}
.repbar .ttl div{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repbar .ic{width:84px;border:0;border-left:1px solid rgba(255,255,255,.28);background:none;display:grid;place-items:center}
.rephead{padding:12px 22px 9px;border-bottom:1px solid #e8e8e8;display:flex;align-items:flex-start;min-height:62px;position:relative}
.rephead h2{margin:0;font-size:23px;font-weight:400;line-height:1.2}
.rephead .info{margin-left:auto;background:none;border:0;padding:6px 4px;display:flex}
.meta{display:flex;gap:18px;font-size:12.5px;color:#444;margin-top:5px}
.meta span{display:flex;align-items:center;gap:5px}
.cols,.erow{display:grid;grid-template-columns:94px minmax(0,1fr) 128px 90px 30px 32px 34px;align-items:center;padding:0 18px 0 34px}
.cols{height:38px;flex:none;font-size:13px;font-weight:700;color:#444;border-bottom:1px solid #eee;text-transform:uppercase}
.cols>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols svg{display:block}
.erows{flex:1;overflow:auto;min-height:0}
.erow{height:61px;border-bottom:1px solid #e9e9e9;cursor:pointer;font-size:15px}
.erow:hover{background:#F2F7FD}
.erow.sel{background:#E3F0FC}
.erow.ret{background:#FDF0DA}
.erow.muted{color:#9a9a9a}
.erow.muted svg{opacity:.45}
.erow .d{font-size:14px;line-height:1.1}
.erow .d small{display:block;font-size:12.5px}
.erow .x{display:flex;align-items:center;gap:12px;font-size:15.5px}
.erow .amt{text-align:right;line-height:1.05;padding-right:26px}
.erow .amt small{display:block;font-size:12.5px}
.erow .pm{text-align:right;padding-right:8px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#333;font-size:17px;padding:0 70px;line-height:1.15}
.btn-add{margin-top:22px;background:#2D6FC8;color:#fff;border:0;height:45px;padding:0 10px 0 14px;font-size:18px;display:flex;align-items:center;gap:9px}
.repfoot{display:grid;grid-template-columns:1fr 1fr 1fr;flex:none;border-top:1px solid #e3e3e3;background:#F7F7F7;min-height:74px}
.repfoot>div{padding:12px 13px;border-right:1px solid #e3e3e3;font-size:16px;line-height:1.5}
.repfoot .big{font-size:26px;font-weight:500}
.submit{margin:12px 14px;background:#2E7D4F;color:#fff;border:0;font-size:17px}
.submit:disabled{opacity:.45;cursor:default}
.rl{grid-template-columns:minmax(0,1fr) 150px 120px 110px}
.rlrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px 110px;align-items:center;padding:0 18px 0 34px;height:61px;border-bottom:1px solid #e9e9e9;cursor:pointer}
.rlrow:hover{background:#F2F7FD}
.status{font-size:13px;font-weight:500;padding:3px 8px;border-radius:3px;justify-self:start}
.status.draft{background:#EEF1F4;color:#444}.status.returned{background:#FBE3E3;color:#B71C1C}.status.submitted{background:#E3F2E8;color:#1E6B3C}

/* right panel chrome */
.actbar{height:88px;flex:none;background:#EEF2F6;border-bottom:1px solid #e1e5ea;display:flex;align-items:center;justify-content:flex-end;gap:13px;padding:0 30px}
.actbar .lefty{margin-right:auto}
.btn{height:45px;min-width:90px;padding:0 22px;border:1px solid #2C7BD6;background:#fff;color:#2C7BD6;font-size:16px;border-radius:2px}
.btn.pri{background:#2C7BD6;color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.fhead{display:flex;align-items:center;gap:26px;padding:8px 24px;border-bottom:1px solid #e6e6e6;min-height:84px}
.fhead .tico{width:68px;height:66px;border:1px solid #e3e3e3;border-radius:3px;display:grid;place-items:center;position:relative;flex:none}
.fhead .tico.plain{border:0}
.fhead .tico .car{position:absolute;bottom:3px;left:50%;margin-left:-4px;border:4px solid transparent;border-top:5px solid #555}
.fhead h1{font-size:31px;font-weight:400;color:#2F74D0;margin:0;line-height:1.15}
.frow{display:grid;grid-template-columns:263px minmax(0,1fr);align-items:start;padding:12px 30px 12px 24px;border-bottom:1px solid #EDEFF2;min-height:71px;position:relative}
.frow.nb{border-bottom:0;min-height:64px}
.frow>label,.frow>.lab{padding-top:10px;font-size:17px}
.frow .val{padding-top:10px;font-size:17px;white-space:pre-wrap}
.inp{height:45px;border:1px solid #9aa0a6;background:#fff;padding:0 12px;font-size:17px;width:100%;border-radius:0}
.inp.num{width:187px;text-align:right}
.inp.date{width:187px}
.inp::placeholder{color:#777}
.inp:focus,.dd-btn:focus,.pin:focus{outline:none;border-color:#2C7BD6;box-shadow:0 0 0 1px #2C7BD6}
textarea.inp{height:113px;padding:10px 12px;resize:vertical;display:block}
.spent{display:flex}
.spent .inp{border-right:0}
.err .inp,.err .dd-btn{border-color:#D32F2F}
.errmsg{color:#C62828;font-size:14px;margin-top:6px}
.banner{margin:14px 24px 0;padding:12px 16px;font-size:16px;border-left:5px solid}
.banner.err{background:#FDECEC;border-color:#D32F2F;color:#8E1B1B}
.hold{position:sticky;top:0;z-index:26;margin:0;padding:12px 24px 12px 20px;font-size:16px;background:#FFF6DB;border-left:5px solid #E2A100;border-bottom:1px solid #F0D58A;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hold b{display:block;margin-bottom:2px}
.hold button{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:#7a5a00}
.sec{background:#F6F7F9;padding:18px 24px;font-size:19px;font-weight:700;border-bottom:1px solid #E7E9EC;border-top:1px solid #E7E9EC;display:flex;align-items:center;gap:12px}

/* dropdown */
.dd{position:relative;width:309px}
.dd-btn{width:100%;height:45px;border:1px solid #9aa0a6;background:#fff;text-align:left;padding:0 36px 0 12px;font-size:17px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0}
.dd-btn .ph{color:#555}
.dd-btn.arrow::after{content:"";position:absolute;right:15px;top:19px;border:6px solid transparent;border-top:7px solid #222}
.dd.open .dd-btn{border-color:#2C7BD6;box-shadow:0 0 0 1px #2C7BD6}
.dd-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #9aa0a6;z-index:30;max-height:310px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.dd-opt{padding:13px 12px;font-size:17px;border-bottom:1px solid #eee;cursor:pointer;white-space:nowrap}
.dd-opt:hover,.dd-opt.act{background:#CFE4F8}
.cur{width:62px}
.cur .dd-btn{background:#F1F3F5;padding:0 10px;text-align:center;color:#444}
.gk{width:160px}
.gk .dd-btn{background:#E8E9EB;border-right:0}
.attdd{width:auto}
.attdd .dd-list{left:auto;width:240px}

/* project + guests */
.psearch{padding:12px 24px;position:relative}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr) auto 34px;gap:10px;align-items:start;padding:14px 24px;border-bottom:1px solid #EDEFF2;font-size:15px}
.prow b{font-weight:700}
.prow .pp{display:flex;align-items:center;gap:6px}
.prow .pp input{width:80px}
.addalloc{display:flex;align-items:center;gap:10px;padding:10px 24px 18px;color:#bbb;font-size:17px;background:none;border:0}
.addalloc.on{color:#2F74D0}
.gadd{display:flex;padding:12px 24px 6px}
.gin-wrap{flex:1;position:relative}
.gin-wrap .inp{border-left-color:#9aa0a6}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #9aa0a6;border-top:0;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.14);max-height:320px;overflow:auto}
.sg{padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;line-height:1.3}
.sg:hover,.sg.act{background:#CFE4F8}
.sg i{color:#555}
.csv{display:inline-block;padding:2px 24px 8px;color:#2F74D0;font-size:17px;background:none;border:0}
.grow{display:grid;grid-template-columns:92px 36px minmax(0,1fr) 90px 97px;gap:6px;align-items:start;padding:10px 24px;font-size:17px}
.grow .gx{background:none;border:0;font-size:20px;line-height:1;padding:2px 6px;color:#333}
.grow .who{line-height:1.2}
.grow .who i{display:block}
.pin{height:45px;border:1px solid #9aa0a6;text-align:right;padding:0 10px;font-weight:700;font-size:17px;width:100%;border-radius:0}
.gtot{display:grid;grid-template-columns:1fr 90px 97px;gap:6px;padding:4px 30px 20px 24px;color:#777;font-weight:700;text-align:right;font-size:17px}

/* attachments */
.att-tools{margin-left:auto;display:flex;gap:12px}
.att-tools button{background:none;border:0;padding:2px;display:flex;opacity:.55}
.att-tools button.on{opacity:1}
.att-body{padding:18px 24px 26px;display:flex;flex-direction:column;align-items:center;gap:16px}
.att-body.drag{background:#EAF3FD;outline:2px dashed #2F74D0;outline-offset:-8px}
.att-drop{display:flex;align-items:center;gap:22px;font-size:17px;color:#333}
.btn-att{height:45px;background:#2C7BD6;color:#fff;border:0;padding:0 16px;font-size:17px;display:flex;align-items:center;gap:10px}
.btn-att::after{content:"";border:5px solid transparent;border-top:6px solid #fff;margin-top:6px}
.att-grid{display:flex;flex-wrap:wrap;gap:14px;width:100%}
.att-list{width:100%}
.att-li{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #eee;cursor:pointer}
.thumb{width:142px;border:1px solid #d9dde2;background:#fff;cursor:pointer;position:relative}
.thumb:hover{border-color:#2F74D0}
.pv{position:relative;overflow:hidden;background:#E9ECEF}
.pv .pz{position:absolute;left:5px;top:5px;transform-origin:0 0;pointer-events:none}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv .pdf{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:#B71C1C}
.thumb .fn{font-size:12px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #eee}
.thumb .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:1;z-index:2}

/* add expenses */
.addwrap{display:grid;grid-template-columns:286px minmax(0,1fr);flex:1;min-height:0}
.addnav{background:#F4F5F7;border-right:1px solid #e3e3e3;overflow:auto}
.addnav h1{font-size:28px;color:#2F74D0;font-weight:400;line-height:1.05;margin:20px 16px 22px}
.navitem{display:flex;align-items:center;gap:10px;padding:13px 38px;font-size:18px;background:none;border:0;width:100%;text-align:left}
.navitem:hover{background:#E8EEF5}
.navitem.top{font-weight:700;padding:14px 18px}
.navitem.on{background:#CDE4FA}
.navgrp{font-weight:700;color:#444;padding:18px 16px 8px;font-size:18px;border-top:1px solid #e3e3e3}
.navitem .dot{width:8px;height:8px;border-radius:50%;background:#2E7D4F;margin-left:-20px}
.addmain{overflow:auto;padding:4px 14px 20px}
.search{position:relative;width:464px;max-width:100%;border:2px solid #2F74D0;border-radius:3px;height:51px;margin:14px 0 12px;display:flex;align-items:center}
.search .fl{position:absolute;top:-11px;left:12px;background:#fff;padding:0 5px;font-size:14px;color:#2F74D0}
.search input{border:0;outline:0;flex:1;height:100%;padding:0 14px;font-size:17px;background:transparent}
.search svg{margin-right:12px}
.faster{background:#EAF4FD;border:1px solid #d7e8f8;padding:14px 16px;margin-bottom:14px;font-size:14.5px;line-height:1.45}
.faster b{display:block;margin-bottom:2px}
.faster .acts{display:flex;align-items:center;gap:18px;margin-top:10px}
.btn-up{height:38px;background:#2C7BD6;color:#fff;border:0;padding:0 14px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:15px}
.lnk{background:none;border:0;color:#2F74D0;display:flex;align-items:center;gap:6px;font-size:15px;padding:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,147px);gap:13px}
.tile{height:148px;border:1px solid #e1e4e8;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:13.5px;color:#444;text-transform:uppercase;text-align:center;line-height:1.05;padding:8px}
.tile:hover{border-color:#2F74D0}
.tile .tc{border:4px solid transparent;border-top:5px solid #555;margin-top:-8px}
.ewempty{padding:60px 20px;color:#666;text-align:center;font-size:17px}

/* detail */
.vrow{display:grid;grid-template-columns:263px minmax(0,1fr);padding:14px 30px 14px 24px;border-bottom:1px solid #EDEFF2;font-size:17px}
.vrow .v{white-space:pre-wrap}
.gv{display:grid;grid-template-columns:90px minmax(0,1fr) 120px;gap:8px;padding:12px 30px 12px 24px;font-size:17px;line-height:1.2}
.gv i{display:block}
.gv .a{text-align:right;font-weight:700}
.tax{display:grid;grid-template-columns:100px minmax(0,1fr);border-top:1px solid #EDEFF2;border-bottom:1px solid #EDEFF2}
.tax .tl{display:flex;align-items:center;padding-left:14px;font-size:17px}
.tax .tr{background:#EEF2F6;display:grid;grid-template-columns:1fr 1fr 1fr;row-gap:16px;padding:16px 60px 16px 70px;font-size:17px}
.cmt{padding:16px 24px;border-bottom:1px solid #eee}
.cmt b{font-size:15px}.cmt time{color:#999;font-size:13px;margin-left:8px}
.cmt p{margin:6px 0 0;font-size:16px}
.cadd{display:flex;gap:14px;padding:18px 24px 26px}
.cadd .btn{background:#E9EBEE;border-color:#E9EBEE;color:#999;min-width:186px}
.cadd .btn.on{background:#2C7BD6;border-color:#2C7BD6;color:#fff}
.pager{height:58px;flex:none;border-top:1px solid #e3e3e3;background:#F6F7F9;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:19px}
.pager button{background:none;border:0;color:#2F74D0;font-size:19px;display:flex;align-items:center;gap:10px}
.pager button:disabled{color:#bbb;cursor:default}

/* modal + popovers */
.modal-bg{position:fixed;inset:0;background:rgba(20,28,38,.55);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;width:min(1120px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.sm{width:520px}
.mhead{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #e5e5e5;font-size:20px}
.mhead .x{margin-left:auto;background:none;border:0;font-size:28px;line-height:1;color:#555}
.mhead .zm{display:flex;gap:6px;margin-left:auto}
.mhead .zm+.x{margin-left:12px}
.mhead .zm button{width:36px;height:32px;border:1px solid #ccc;background:#fff;font-size:18px}
.mbody{overflow:auto;padding:20px;flex:1;min-height:0}
.mbody p{margin:0 0 10px;font-size:16px;line-height:1.5}
.mfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid #e5e5e5;background:#f7f8fa}
.mfoot .hint{margin-right:auto;color:#666;font-size:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.galitem{border:2px solid #e1e4e8;cursor:pointer;position:relative;background:#fff}
.galitem.on{border-color:#2F74D0;box-shadow:0 0 0 2px #cfe4f8}
.galitem .chk{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:3px;border:2px solid #fff;background:rgba(0,0,0,.35);z-index:2;display:grid;place-items:center;color:#fff;font-size:15px}
.galitem.on .chk{background:#2F74D0}
.galitem .eye{position:absolute;top:8px;right:8px;z-index:2;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 8px;border-radius:3px}
.galitem .cap{padding:8px 10px;font-size:13px;line-height:1.3;border-top:1px solid #eee}
.galitem .cap div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.galitem .cap small{color:#777}

/* ---------- document maths and facts (also sent with events) ---------- */
function groupsOf(items) {
  const g = {};
  for (const [q, , u, r] of items) g[r] = (g[r] || 0) + q * cents(u);
  return Object.keys(g).map(Number).sort((a, b) => ((a === 0) - (b === 0)) || a - b).map(r => {
    const gross = g[r] / 100, net = round2(gross / (1 + r / 100));
    return {rate: r, gross: round2(gross), net, vat: round2(gross - net)};
  });
}
function appTotals(d) {
  const sub = d.items.reduce((s, [q, , u]) => s + q * cents(u), 0) / 100;
  const fees = d.fees.reduce((s, [, a]) => s + cents(a), 0) / 100;
  return {sub: round2(sub), fees: round2(fees), total: round2(sub + fees + d.tip)};
}
function factsOf(d) {
  if (!d) return null;
  if (d.kind === 'invoice') {
    const g = groupsOf(d.items), total = round2(g.reduce((s, x) => s + x.gross, 0)), tip = d.tip || 0;
    const sup = d.onBehalf || d.supplier || d.letterhead;
    return {kind: 'invoice', supplier: sup.name, supplier_address: sup.address || (d.letterhead ? d.letterhead.lines.slice(0, 2).join(', ') : ''),
      issued_by: d.onBehalf ? d.letterhead.name : null, invoice_no: d.number, service_date: d.date, invoice_date: d.issueDate || d.date,
      consumption: d.consumption || null, vat_breakdown: g, invoice_total: total, tip, total_paid: round2(total + tip),
      addressed_to: d.recipient ? `${d.recipient.name}, ${d.recipient.address}` : null, corrects: d.correctionOf || null, is_tax_invoice: true};
  }
  if (d.kind === 'order_confirmation') {
    const t = appTotals(d);
    return {kind: 'order_confirmation', platform: d.platform, supplier: d.restaurant, supplier_address: d.restaurantAddress, order_no: d.orderNo,
      service_date: d.date, invoice_date: d.date, total_paid: t.total, tip: d.tip, vat_breakdown: null, is_tax_invoice: false,
      note: 'States that it is not a tax invoice; invoice is downloadable on the platform website.'};
  }
  if (d.kind === 'approval_email' || d.kind === 'correction_email')
    return {kind: d.kind, subject: d.subject, messages: d.messages.map(m => ({from: m.from, date: m.date, text: m.body.join(' ')}))};
  if (d.kind === 'upload') return {kind: 'upload', file: d.file, mime: d.mime};
  return null;
}

function emit(type, payload = {}, quiet = false) {
  const u = U();
  const evt = {id: ++seq, type, t: +((Date.now() - t0) / 1000).toFixed(2), at: new Date().toISOString(), session_id: sessionId,
    user: u.name, role: u.role, screen: screenName(), overlay: overlayName(), ...payload};
  if (!quiet || V.devActivity) { LOG.push(evt); if (LOG.length > 600) LOG.shift(); scheduleDev(); }
  listeners.forEach(fn => { try { fn(evt); } catch (e) { console.error(e); } });
  try { window.dispatchEvent(new CustomEvent(CHANNEL, {detail: evt})); } catch (e) { /* ignore */ }
  const msg = {source: CHANNEL, event: evt};
  if (window.parent !== window) { try { window.parent.postMessage(msg, '*'); } catch (e) { /* ignore */ } }
  if (window.opener) { try { window.opener.postMessage(msg, '*'); } catch (e) { /* ignore */ } }
  if (bc) { try { bc.postMessage(msg); } catch (e) { /* ignore */ } }
  if (hookUrl) { try { fetch(hookUrl, {method: 'POST', mode: 'no-cors', keepalive: true, headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(evt)}).catch(() => {}); } catch (e) { /* ignore */ } }
  return evt;
}

/* ---------- calculations ---------- */
function recalcGuests(d) {
  const n = d.guests.length;
  if (!n) return;
  const c = Math.round((d.spent || 0) * 100);
  if (d.alloc_mode !== 'manual') {
    const base = Math.floor(c / n), rem = c - base * n, pb = Math.floor(10000 / n), pr = 10000 - pb * n;
    d.guests.forEach((g, i) => { g.amount = (base + (i === 0 ? rem : 0)) / 100; g.pct = (pb + (i === 0 ? pr : 0)) / 100; });
  } else {
    d.guests.forEach(g => { g.amount = round2((d.spent || 0) * g.pct / 100); });
  }
}
function taxLines(e) {
  const red = CONFIG.vat.reduced, std = CONFIG.vat.standard;
  const tax = (g, r) => round2(g - round2(g / (1 + r / 100)));
  if (e.location && e.location !== CONFIG.homeCountry) return [{code: 'V0', rate: 0, amount: 0, applies_to: 'all (foreign)'}];
  if (e.type_of_meal === 'Take Away') return [
    {code: 'V2', rate: red, amount: tax(e.meal_amount, red), applies_to: 'meal'},
    {code: 'V1', rate: std, amount: tax(e.drink_amount, std), applies_to: 'drink'},
    {code: 'V0', rate: 0, amount: 0, applies_to: 'tip'}];
  if (e.type_of_meal === 'Eat In') return [
    {code: 'V1', rate: std, amount: tax(e.meal_amount, std), applies_to: 'meal'},
    {code: 'V1', rate: std, amount: tax(e.drink_amount, std), applies_to: 'drink'},
    {code: 'V0', rate: 0, amount: 0, applies_to: 'tip'}];
  return [];
}
function docBrief(id) { const d = getDoc(id); return d ? {id, file: d.file, kind: d.kind, facts: factsOf(d)} : {id, missing: true}; }
function snapshot(e) {
  const n = e.guests.length;
  return {id: e.id, expense_type: e.expense_type, transaction_date: e.transaction_date, spent: e.spent, currency: e.currency,
    location: e.location || null, business_purpose: e.business_purpose, meal_amount: e.meal_amount, drink_amount: e.drink_amount,
    tip_amount: e.tip_amount, components_total: round2(e.meal_amount + e.drink_amount + e.tip_amount),
    restaurant_name: e.restaurant_name, restaurant_address: e.restaurant_address, type_of_meal: e.type_of_meal || null,
    projects: e.projects.map(p => ({code: p.code, name: p.name, pct: p.pct})),
    guests: e.guests.map(g => ({name: g.name, title: g.title, kind: g.kind, org: g.org, pct: g.pct, amount: g.amount})),
    guest_count: n, amount_per_person: n ? round2(e.spent / n) : null, tax_lines: taxLines(e),
    attachments: e.attachments.map(docBrief), comments: e.comments, returned: !!e.returned};
}
function reportSummary(r) {
  return {id: r.id, number: r.number, name: r.name, status: r.status, office: r.office,
    total: round2(r.expenses.reduce((s, e) => s + e.spent, 0)), expense_count: r.expenses.length};
}
function validate(d) {
  const e = {};
  if (!d.transaction_date) e.transaction_date = 'Enter the transaction date.';
  if (!(d.spent > 0)) e.spent = 'Enter the amount spent.';
  if (!d.location) e.location = 'Select a location.';
  if (!d.business_purpose.trim()) e.business_purpose = 'Enter a business purpose.';
  const comp = round2(d.meal_amount + d.drink_amount + d.tip_amount);
  if (d.spent > 0 && Math.abs(comp - d.spent) > 0.005)
    e.meal_amount = `Meal, Drink and Tip add up to ${money(comp)}, but Spent is ${money(d.spent)}.`;
  if (!d.restaurant_name.trim()) e.restaurant_name = 'Enter the restaurant name.';
  if (!d.restaurant_address.trim()) e.restaurant_address = 'Enter the restaurant address.';
  if (!d.type_of_meal) e.type_of_meal = 'Select a type of meal.';
  if (!d.projects.length) e.project = 'Select a project.';
  else if (Math.abs(d.projects.reduce((s, p) => s + p.pct, 0) - 100) > 0.01) e.project = 'Project allocations must add up to 100 %.';
  if (!d.guests.length) e.guests = 'Add at least one guest or recipient.';
  else if (Math.abs(d.guests.reduce((s, g) => s + g.pct, 0) - 100) > 0.05) e.guests = 'Guest allocations must add up to 100 %.';
  return e;
}
const isComplete = e => !Object.keys(validate(e)).length && e.attachments.length > 0;

function devLogText() { return LOG.slice(-80).reverse().map(e => `${e.t.toFixed(1).padStart(7)}s ${e.type} ${e.type === 'screen_changed' ? '→ ' + e.screen + (e.overlay ? ' + ' + e.overlay : '') : JSON.stringify(devBrief(e))}`).join('\n'); }
function devBrief(e) {
  const skip = new Set(['id', 'type', 't', 'at', 'session_id', 'user', 'role', 'screen', 'overlay']);
  const o = {};
  for (const k of Object.keys(e)) if (!skip.has(k)) o[k] = (k === 'expense' || k === 'state' || k === 'report') ? '{…}' : e[k];
  if (o.doc && o.doc.facts) o.doc = {id: o.doc.id, kind: o.doc.kind};
  return o;
}

/* ---------- save flow with optional tutor guard ---------- */
const pending = new Map();

  if (V.localGuard) {
    return Promise.race([Promise.resolve().then(() => V.localGuard(snap)), new Promise(r => setTimeout(() => r({allow: true, timeout: true}), CONFIG.guardTimeoutMs))])
      .then(x => x || {allow: true}).catch(() => ({allow: true}));
  }
  const request_id = uid('req');
  return new Promise(resolve => {
    const timer = setTimeout(() => { pending.delete(request_id); emit('save_guard_timeout', {request_id}); resolve({allow: true, timeout: true}); scheduleDev(); }, CONFIG.guardTimeoutMs);
    pending.set(request_id, d => { clearTimeout(timer); pending.delete(request_id); resolve(d); scheduleDev(); });
    emit('save_requested', {request_id, expense: snap, timeout_ms: CONFIG.guardTimeoutMs});
  });
}
async function saveForm() {

function handleCmd(m) {

    case 'save_decision': {
      const key = m.request_id && pending.has(m.request_id) ? m.request_id : [...pending.keys()].pop();
      if (key) pending.get(key)({allow: m.allow !== false, message: m.message, title: m.title, fields: m.fields, note: m.note});
      break;
    }
    case 'highlight': {
      const fields = m.fields || (m.field ? [m.field] : []);

      applyHighlight(); if (fields[0]) scrollToField(fields[0]);

    case 'reset': resetData(); break;

    case 'pager': {
      const r = R(), i = r.expenses.findIndex(x => x.id === V.expenseId) + Number(ds.dir);
      if (r.expenses[i]) { V.expenseId = r.expenses[i].id; render(); emit('expense_viewed', {expense: snapshot(r.expenses[i])}); }
      break;
    }
    case 'comment-post': {
      const inp = document.querySelector('[data-comment]'), txt = inp ? inp.value.trim() : '';
      if (!txt) break;
      const ex = findExp(V.expenseId); ex.comments.push({by: U().name, at: new Date().toISOString(), text: txt}); persist();
      emit('comment_posted', {expense_id: ex.id, text: txt}); render(); break;
    }
    case 'submit': {
      const r = R(); if (!r || !r.expenses.length) break;
      const total = r.expenses.reduce((s, x) => s + x.spent, 0);
      confirmBox('Submit report', [`Submit “${r.name}” with ${r.expenses.length} expense(s) totalling ${money(total)} EUR?`, 'The report goes to your approver and then to Global Audit. You cannot edit it after submitting.'], 'Submit', submitReport);
      break;
    }
    default: break;
  }
});
function closeModal() {
  const m = V.modal; if (!m) return;
  if (m.type === 'viewer') { closeViewerEvent(); if (V.returnTo) { V.modal = V.returnTo; V.returnTo = null; render(); return; } }
  V.modal = null; render();
}
function confirmBox(title, lines, yes, onYes) { V.modal = {type: 'confirm', title, lines, yes, onYes}; renderLayer(); }
function pickDD(key, value) {
  V.openDD = null; V.ddActive = -1;
  if (key === 'pay_in' || key === 'report_office') { V.newRep[key] = value; renderRight(); return; }
  if (key === 'guest_kind') { V.guestKind = value; rerenderRight(); const gi = document.querySelector('[data-gin]'); if (gi) gi.focus(); return; }
  if (V.draft) { setField(key, value); delete V.errors[key]; }
  rerenderRight();
}

/* ---------- typing ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('#dev')) return;
  if (t.dataset.f) {
    const f = t.dataset.f;
    setField(f, NUM_FIELDS.includes(f) ? parseNum(t.value) : t.value, false);
    if (V.errors[f]) { delete V.errors[f]; t.closest('.frow').classList.remove('err'); const em = t.closest('.frow').querySelector('.errmsg'); if (em) em.remove(); }
  } else if ('nr' in t.dataset) { V.newRep.name = t.value; }
  else if ('gin' in t.dataset) showGuestSugg();
  else if ('pin' in t.dataset) showProjSugg();
  else if ('typeq' in t.dataset) { V.typeQuery = t.value; const pos = t.selectionStart; renderRight(); const n = document.querySelector('[data-typeq]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if ('comment' in t.dataset) { const b = $('#postBtn'); if (b) b.classList.toggle('on', !!t.value.trim()); }
  else if ('gpct' in t.dataset || 'gamt' in t.dataset) {
    const d = V.draft, i = Number(t.dataset.gpct ?? t.dataset.gamt), g = d.guests[i]; d.alloc_mode = 'manual';
    if ('gpct' in t.dataset) { g.pct = parseNum(t.value); g.amount = round2(d.spent * g.pct / 100); }
    else { g.amount = parseNum(t.value); g.pct = d.spent ? round2(g.amount / d.spent * 100) : 0; }
    updateGuestsUI();
  } else if ('ppct' in t.dataset) { V.draft.projects[Number(t.dataset.ppct)].pct = parseNum(t.value); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('#dev')) return;
  if (t.dataset.f) {
    const f = t.dataset.f, v = NUM_FIELDS.includes(f) ? parseNum(t.value) : t.value;
    if (NUM_FIELDS.includes(f)) t.value = numVal(f, v);
    setField(f, v, true);
  } else if ('gpct' in t.dataset || 'gamt' in t.dataset) {
    const i = Number(t.dataset.gpct ?? t.dataset.gamt), g = V.draft.guests[i];
    t.value = 'gpct' in t.dataset ? pctTxt(g.pct) : money(g.amount);
    emit('allocation_changed', {guest: g.name, pct: g.pct, amount: g.amount, total_pct: round2(V.draft.guests.reduce((s, x) => s + x.pct, 0))});
  } else if ('ppct' in t.dataset) {
    emit('project_allocation_changed', {projects: V.draft.projects.map(p => ({code: p.code, pct: p.pct}))});
  }
});
document.addEventListener('keydown', e => {
  if (e.altKey && e.shiftKey && e.code === 'KeyD') { e.preventDefault(); toggleDev(); return; }
  const t = e.target;
  if (e.key === 'Escape') {
    if (V.openDD) { V.openDD = null; rerenderRight(); return; }
    if (V.modal) { closeModal(); return; }
  }
  if (V.openDD && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key) && V.openDD !== 'att_add') {
    e.preventDefault();
    const opts = ddOptions(V.openDD);
    if (e.key === 'Enter') { if (opts[V.ddActive]) pickDD(V.openDD, opts[V.ddActive].v); return; }
    V.ddActive = (V.ddActive + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length; rerenderRight();
    const b = document.querySelector(`[data-ddwrap="${V.openDD}"] .dd-btn`); if (b) b.focus();
    return;
  }
  if (V.modal && V.modal.type === 'viewer' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const btn = document.querySelector(`[data-action="viewer-nav"][data-dir="${e.key === 'ArrowRight' ? 1 : -1}"]`); if (btn && !btn.disabled) btn.click(); return;
  }
  if (t.dataset && 'gin' in t.dataset && e.key === 'Enter') { e.preventDefault(); pickGuest(V.gact || 0); return; }
  if (t.dataset && 'pin' in t.dataset && e.key === 'Enter') { e.preventDefault(); pickProject(0); return; }
  if (t.dataset && 'comment' in t.dataset && e.key === 'Enter') { const b = $('#postBtn'); if (b) b.click(); return; }
  if (t.dataset && 'nr' in t.dataset && e.key === 'Enter') { const b = document.querySelector('[data-action="newrep-save"]'); if (b) b.click(); }
});

/* ---------- file upload + drag and drop ---------- */
$('#fileIn').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  const ids = [];
  for (const f of files) ids.push(await addUpload(f));
  if (V.fileTarget === 'create') openForm(newDraft(ids), true, {created_from_upload: ids});
  else if (V.draft) { ids.forEach(attach); rerenderRight(); }
});
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && V.draft) { e.preventDefault(); z.classList.add('drag'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('drag'); });
document.addEventListener('drop', async e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z || !V.draft) return;
  e.preventDefault(); z.classList.remove('drag');
  for (const f of [...e.dataTransfer.files]) attach(await addUpload(f));
  rerenderRight();
});

/* ---------- activity signals for pause detection ---------- */
const lastAct = {};
function activity(kind) { const n = Date.now(); if (n - (lastAct[kind] || 0) < 1000) return; lastAct[kind] = n; emit('user_activity', {kind, activity: true}, true); }
document.addEventListener('keydown', () => activity('typing'), true);
document.addEventListener('pointerdown', () => activity('pointer'), true);
document.addEventListener('pointermove', () => activity('pointer'), {passive: true, capture: true});
document.addEventListener('wheel', () => activity('scroll'), {passive: true, capture: true});

/* ---------- demo controls ---------- */
function toggleDev() { const el = $('#dev'); el.hidden = !el.hidden; renderDev(); }
function devClick(e) {
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  if (act === 'dev-close') { $('#dev').hidden = true; return; }
  if (act === 'switch-user') { switchUser(a.dataset.user); return; }
  if (act === 'dev-guard') { handleCmd({cmd: 'guard', enabled: !V.guardRemote}); }
  if (act === 'dev-block') { blockNext = true; toast('The next Save will be blocked once.'); }
  if (act === 'dev-decide') handleCmd({cmd: 'save_decision', allow: a.dataset.allow === '1', message: a.dataset.allow === '1' ? '' : 'Blocked manually from the demo controls.'});
  if (act === 'dev-hook') { hookUrl = ($('#devHook').value || '').trim(); toast(hookUrl ? 'Events now also POST to ' + hookUrl : 'Webhook off'); }
  if (act === 'dev-session') newSession();
  if (act === 'dev-reset') resetData();
  if (act === 'dev-clear') LOG.length = 0;
  if (act === 'dev-activity') V.devActivity = !V.devActivity;
  if (act === 'dev-copy') {
    const txt = JSON.stringify(LOG, null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Events copied')).catch(() => { console.log(txt); toast('Copy blocked here – events printed to the console'); });
  }
  renderDev();
}

/* ---------- start ---------- */
S = loadState();
if (params.get('user') && CONFIG.users[params.get('user')]) S.userId = params.get('user');
persist();
render();
emit('session_started', {mode: guardActive() ? 'tutor' : 'capture'});
if (params.has('dev')) toggleDev();
</script>
</body>
</html>
